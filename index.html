<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectando al Sistema de Autobuses...</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; margin: 0; }
        .mensaje { text-align: center; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="mensaje">
        <h2>Buscando el autobús... 🚌</h2>
        <div class="loader"></div>
        <p>Por favor, asegúrate de estar conectado a la red WiFi del vehículo.</p>
    </div>

    <script>
        async function conectarAlServidor() {
            // ⚠️ REEMPLAZA ESTA URL CON LA DE TU REALTIME DATABASE (Mantén el /config.json al final)
            const firebaseUrl = "https://TU-PROYECTO-default-rtdb.firebaseio.com/config.json";
            
            try {
                const respuesta = await fetch(firebaseUrl);
                const datos = await respuesta.json();
                
                if (datos && datos.ip_servidor) {
                    // Redirección automática a la IP local descubierta
                    const urlLocal = `http://${datos.ip_servidor}:${datos.puerto}`;
                    window.location.replace(urlLocal);
                } else {
                    document.querySelector('.mensaje p').innerText = "El sistema del autobús no está reportando señal. Inténtalo de nuevo.";
                }
            } catch (error) {
                document.querySelector('.mensaje p').innerText = "Error de conexión. Verifica que tienes acceso a internet o a la red del bus.";
            }
        }

        // Ejecutar inmediatamente al cargar la página
        conectarAlServidor();
    </script>

</body>
</html>
